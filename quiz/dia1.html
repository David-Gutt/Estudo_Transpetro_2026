ções ocorrem à medida que há risco."}],correta:"B",explicacao:"O 'embora' (concessão) e 'todavia' (adversidade) são conectores de oposição. A Cesgranrio AMA cobrar 'embora + verbo no subjuntivo' vs 'mas/todavia + indicativo'. Aqui, 'embora eficiente, demanda...' opõe duas ideias: eficiência vs necessidade de manutenção. O segundo conectivo 'todavia' reforça a oposição.",dica:"Dica Cesgranrio: Quando vir 'embora', 'conquanto', 'ainda que', procure ideia de contraste, mesmo que a frase pareça positiva. 90% das pegadinhas estão em trocar adversidade por conclusão."},{id:2,materia:"Português",apostila:"Apostila 01",pagina:"p. 34-37",topico:"Crase",textoApoio:void 0,enunciado:"Assinale a opção em que o acento indicativo de crase está empregado de acordo com a norma-padrão, considerando o contexto de atividades administrativas na Transpetro:",alternativas:[{letra:"A",texto:"O relatório foi encaminhado à gerente de logística, que estava à bordo do navio."},{letra:"B",texto:"A equipe dedicou-se à análise dos custos, visando à redução de desperdícios."},{letra:"C",texto:"Chegamos à conclusão de que é necessário obedecer à normas de segurança."},{letra:"D",texto:"A apresentação será às 14h, mas entregaremos o material à partir das 13h."},{letra:"E",texto:"Referimo-nos àquele processo que diz respeito à contratação."}],correta:"B",explicacao:"B está correta nos dois casos: dedicar-se A (prep) + A análise (artigo) = À. Visar A (prep) + A redução (artigo). A erra em 'a bordo' (locução sem crase). C erra em 'a normas' (sem artigo, normas é plural sem determinação). D erra em 'a partir' (nunca tem crase). E erra pois 'aquele' já tem preposição embutida, não há artigo.",dica:"Macete Cesgranrio: Troque a palavra feminina por masculina. Se virar 'ao', tem crase. Ex: à análise = ao estudo (tem crase). A normas = a regulamentos (sem crase). Eles adoram cobrar 'a partir' e 'a bordo' sem crase."},{id:3,materia:"Português",apostila:"Apostila 01",pagina:"p. 42-45",topico:"Concordância verbal - pegadinha",enunciado:"Considere a frase: 'Faz dois anos que os relatórios de controle de estoque não ___ conferidos, mas ___ de haver inconsistências que ___ a atenção da auditoria.' As formas que preenchem corretamente as lacunas, na ordem dada, são:",alternativas:[{letra:"A",texto:"são - deve - chamam"},{letra:"B",texto:"são - devem - chama"},{letra:"C",texto:"é - deve - chamam"},{letra:"D",texto:"são - deve - chama"},{letra:"E",texto:"é - devem - chamam"}],correta:"A",explicacao:"1ª lacuna: 'relatórios ... não SÃO conferidos' (concorda com relatórios). 2ª: 'DEVE haver' (verbo haver impessoal = singular sempre, pegadinha clássica!). 3ª: 'inconsistências que CHAMAM' (que retoma inconsistências). A banca tenta fazer você concordar 'devem haver' - ERRO! Haver no sentido de existir é sempre singular.",dica:"Pegadinha mortal da Cesgranrio: 'Haver' e 'Fazer' indicando tempo são impessoais. 'Faz dois anos' (nunca Fazem), 'Deve haver problemas' (nunca Devem haver). Se cair, 70% erra."},{id:4,materia:"Português",apostila:"Apostila 01",pagina:"p. 51-54",topico:"Pronome relativo",enunciado:"No trecho 'O terminal onde os combustíveis são armazenados é o mesmo cujo acesso é restrito, o qual foi inspecionado ontem', os pronomes relativos destacados exercem, respectivamente, função de:",alternativas:[{letra:"A",texto:"lugar, posse e retomada com preposição"},{letra:"B",texto:"tempo, posse e explicação"},{letra:"C",texto:"lugar, causa e conclusão"},{letra:"D",texto:"lugar, posse e retomada neutra"},{letra:"E",texto:"explicação, posse e lugar"}],correta:"A",explicacao:"'Onde' = lugar (terminal onde...). Só usa 'onde' para lugar físico, Cesgranrio cobra muito trocar por 'em que' errado. 'Cujo' = posse (acesso DO terminal). Atenção: cujo nunca é antecedido de artigo! 'O cujo' é erro. 'O qual' = retomada com preposição, sempre antecedido de artigo/preposição.",dica:"Cesgranrio ama: onde = lugar físico; em que = pode ser tempo/lugar abstrato. 'Cujo' indica posse e concorda com o que vem DEPOIS: 'terminal cujo acesso' (acesso masc sing)."},{id:5,materia:"Português",apostila:"Apostila 01",pagina:"p. 62-66",topico:"Significação - sinonímia",enunciado:"No texto oficial: 'A diretoria busca mitigar os riscos operacionais, dirimindo dúvidas da equipe e ratificando os protocolos de segurança.' As palavras destacadas podem ser substituídas, sem prejuízo de sentido, respectivamente, por:",alternativas:[{letra:"A",texto:"aumentar, criando, retificando"},{letra:"B",texto:"atenuar, esclarecendo, confirmando"},{letra:"C",texto:"extinguir, levantando, anulando"},{letra:"D",texto:"postergar, sanando, alterando"},{letra:"E",texto:"mensurar, suscitando, ratificando"}],correta:"B",explicacao:"Mitigar = atenuar, suavizar, reduzir (não extinguir!). Dirimir = resolver, esclarecer, sanar dúvidas. Ratificar = confirmar, validar. Parônimo que a Cesgranrio ADORA confundir: ratificar (confirmar) vs retificar (corrigir). Na frase, 'ratificando protocolos' = confirmando que estão corretos.",dica:"Decore para prova: RATificar = confirmar (vem de RATO = válido). RETificar = corrigir (vem de RETO = consertar). Mitigar ≠ eliminar. Sempre cai!"},{id:6,materia:"Matemática",apostila:"Apostila 02",pagina:"p. 12-15",topico:"Conjuntos - Diagrama de Venn",textoApoio:"Em pesquisa com 45 colaboradores da Transpetro sobre cursos de capacitação, verificou-se: 20 gostam de Matemática Financeira, 30 gostam de Português Instrumental, 10 gostam de ambas as disciplinas e 5 não gostam de nenhuma.",enunciado:"Considerando os dados acima, o total de colaboradores entrevistados foi de:",alternativas:[{letra:"A",texto:"45"},{letra:"B",texto:"50"},{letra:"C",texto:"55"},{letra:"D",texto:"65"},{letra:"E",texto:"35"}],correta:"A",explicacao:"Diagrama de Venn: Só Matemática = 20-10=10. Só Português =30-10=20. Ambos=10. Nenhum=5. Total =10+20+10+5=45. A pegadinha da Cesgranrio é somar direto 20+30+10+5=65 (letra D). Tem que subtrair a interseção para não contar duas vezes! Fórmula: n(A∪B)=n(A)+n(B)-n(A∩B).",dica:"Sempre que ver 'ambos' ou 'interseção', SUBTRAIA. Desenhe dois círculos se cruzando no rascunho. Eles sempre colocam a soma simples como distrator."},{id:7,materia:"Matemática",apostila:"Apostila 02",pagina:"p. 28-32",topico:"Juros simples",enunciado:"Um fundo de investimento da Transpetro aplicou R$ 12.000,00 a juros simples de 2% ao mês durante 8 meses, para custeio de manutenção preventiva. O montante resgatado ao final foi de:",alternativas:[{letra:"A",texto:"R$ 13.920,00"},{letra:"B",texto:"R$ 14.050,00"},{letra:"C",texto:"R$ 12.192,00"},{letra:"D",texto:"R$ 13.200,00"},{letra:"E",texto:"R$ 14.400,00"}],correta:"A",explicacao:"Juros simples: J = C*i*t = 12000 * 0,02 * 8 = 12000*0,16 = 1920. Montante M=C+J=12000+1920=13.920. Cesgranrio tenta confundir com juros compostos (letra E: 12000*(1,02)^8≈14.050). Para juros simples, taxa * tempo direto.",dica:"No edital Transpetro, juros simples cai muito em 'aplicação comum em finanças'. Fórmula na ponta da língua: M = C(1+it). Não confundir com composto."},{id:8,materia:"Matemática",apostila:"Apostila 02",pagina:"p. 38-41",topico:"Razão e proporção - logística",enunciado:"Na operação logística, 3 caminhões-tanque transportam 4.500 litros de diesel em 3 viagens cada, ou seja, 13.500 litros no total. Mantendo a mesma proporção, quantos litros serão transportados por 7 caminhões em 5 viagens cada?",alternativas:[{letra:"A",texto:"22.500 L"},{letra:"B",texto:"31.500 L"},{letra:"C",texto:"52.500 L"},{letra:"D",texto:"45.000 L"},{letra:"E",texto:"10.500 L"}],correta:"C",explicacao:"Primeiro achar por caminhão/viagem: 4500L /3 viagens =1500L por viagem por caminhão. Agora: 7 caminhões *5 viagens *1500 =35*1500=52.500L. É proporção composta direta. Outra forma: regra de três: 3*3=9 'caminhão-viagem' =13500 => 1=1500. 7*5=35 => 35*1500=52500.",dica:"Cesgranrio adora logística com 'caminhões e viagens'. Transforme tudo em 'unidade de esforço' (caminhão x viagem). É diretamente proporcional."},{id:9,materia:"Matemática",apostila:"Apostila 02",pagina:"p. 55-58",topico:"Análise combinatória - permutação",enunciado:"No porto, 5 navios diferentes aguardam atracação, mas a ordem de atracação importa devido a prioridades de carga. De quantas formas distintas os 5 navios podem ser ordenados para atracar?",alternativas:[{letra:"A",texto:"25"},{letra:"B",texto:"120"},{letra:"C",texto:"60"},{letra:"D",texto:"20"},{letra:"E",texto:"100"}],correta:"B",explicacao:"Permutação simples de 5 elementos: P5 =5! =5*4*3*2*1=120. Se fosse arranjo ou combinação teria critério diferente, mas aqui todos os 5 serão ordenados, então é fatorial puro.",dica:"Se a questão fala 'ordem importa' e 'todos os elementos', é permutação (fatorial). Cesgranrio coloca 5x5=25 como distrator para quem não sabe fatorial."},{id:10,materia:"Matemática",apostila:"Apostila 02",pagina:"p. 68-71",topico:"Probabilidade básica",enunciado:"Em um almoxarifado, há 12 válvulas, sendo 4 defeituosas e 8 perfeitas. Retirando-se uma válvula ao acaso, qual a probabilidade de ela ser perfeita?",alternativas:[{letra:"A",texto:"33,33%"},{letra:"B",texto:"50%"},{letra:"C",texto:"66,67%"},{letra:"D",texto:"25%"},{letra:"E",texto:"75%"}],correta:"C",explicacao:"Probabilidade = casos favoráveis / casos possíveis =8/12 =2/3 ≈66,67%. Simplifique a fração antes. Cesgranrio pode pedir em fração ou %. Saiba converter: 2/3=0,666...",dica:"Probabilidade básica sempre = o que eu quero / total. Se vier 'pelo menos um', use complementar. Aqui é direta."},{id:11,materia:"Processos Administrativos",apostila:"Apostila 03",pagina:"p. 22-26",topico:"Recrutamento interno vs externo",enunciado:"Sobre recrutamento interno e externo no contexto da Transpetro, analise: 'O recrutamento interno, embora motive a equipe, pode gerar conflito de interesses e estagnação. O recrutamento externo, por outro lado, renova a cultura organizacional.' Nesse contexto, é vantagem EXCLUSIVA do recrutamento interno:",alternativas:[{letra:"A",texto:"Renovação da cultura e novas ideias"},{letra:"B",texto:"Redução de custos e tempo, com aproveitamento de talentos já conhecidos e motivação da equipe"},{letra:"C",texto:"Eliminação total de conflitos internos"},{letra:"D",texto:"Maior banco de candidatos e quebra de endogamia"},{letra:"E",texto:"Introdução de sangue novo e atualização de processos"}],correta:"B",explicacao:"Recrutamento interno: vantagens = custo menor (não precisa divulgar, integração), tempo menor, conhecimento prévio do desempenho, motivação/carreira. Desvantagens = pode gerar conflito, estagnação, endogamia. Recrutamento externo = renova cultura, novas ideias, mas mais caro e demorado. Letra B descreve exclusivamente interno.",dica:"Decore para prova: INTERNO = barato, rápido, motiva, mas conserva cultura. EXTERNO = caro, lento, renova. Cesgranrio cobra sempre 'vantagem exclusiva'."},{id:12,materia:"Processos Administrativos",apostila:"Apostila 03",pagina:"p. 31-34",topico:"Entrevista padronizada",enunciado:"Quanto aos tipos de entrevista em seleção de pessoal, a entrevista totalmente padronizada (estruturada) caracteriza-se por:",alternativas:[{letra:"A",texto:"Roteiro livre, sem perguntas pré-definidas, explorando livremente o candidato"},{letra:"B",texto:"Perguntas predeterminadas e iguais para todos os candidatos, permitindo comparação objetiva, mas baixa flexibilidade"},{letra:"C",texto:"Mistura de perguntas fechadas e abertas sem nenhum critério"},{letra:"D",texto:"Ser aplicada apenas para cargos operacionais"},{letra:"E",texto:"Impossibilitar comparação entre candidatos"}],correta:"B",explicacao:"Entrevista totalmente padronizada = estruturada: mesmo roteiro, mesmas perguntas para todos, facilita comparação e reduz viés, porém engessa e não aprofunda. O oposto é a não-estruturada (livre). A semiestruturada é mista. Na Transpetro, usa-se padronizada para isonomia.",dica:"Cesgranrio: padronizada = igual para todos, objetiva, comparável, mas rígida. Não-estruturada = livre, subjetiva, profunda, mas não comparável."}];fun
