<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Dia 5</title><style>:root{--bg:#0a0a0a;--card:#171717;--border:#2a2a2a;--neon:#d4ff00;--muted:#9a9a9a;--text:#f2f2f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}.top{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)}.progress{flex:1;margin:0 16px;height:6px;background:#222;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--neon)}.layout{display:grid;grid-template-columns:300px 1fr}@media(max-width:900px){.layout{grid-template-columns:1fr}}.left{border-right:1px solid var(--border);padding:16px;background:#0f0f0f}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}.crono{font-size:32px;font-weight:900}.btn{width:100%;padding:10px;border-radius:999px;border:1px solid var(--border);background:#111;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.map button{aspect-ratio:1;border-radius:12px;border:1px solid var(--border);background:#111;color:var(--muted);font-weight:700;cursor:pointer}.map button.active{background:var(--neon);color:#000}.map button.done{background:#222;color:#fff}.right{padding:20px;max-width:900px}.tag{display:inline-block;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;border:1px solid var(--border);margin-right:6px}.tag.neon{background:var(--neon);color:#000}.qbox{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden}.alts button{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--border);background:#111;color:var(--text);border-radius:14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px}.alts button.correct{background:#E8FF4A;color:#000}.alts button.wrong{background:#FF5A5F;color:#fff}.exp{padding:16px;background:#0a0a0a;border-top:1px solid var(--border)}.theory{background:#101108;border:1px solid #d4ff0022;border-radius:16px;padding:14px;margin-bottom:16px}.theory b{color:var(--neon)}</style></head><body><div class='top'><div><b>TRANSPETRO 2026 DIA 5</b> - Concordancia + Equacoes + Logistica - 60/40</div><div><span id='timer'>02:00:00</span></div></div><div class='layout'><div class='left'><div class='card'><div>CRONOMETRO 2H</div><div id='cron' class='crono'>02:00:00</div><button class='btn' onclick='togglePause()' id='pauseBtn'>Pausar</button><button class='btn' onclick='resetQuiz()'>Reiniciar</button><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center'><div style='background:#111;border:1px solid var(--border);border-radius:12px;padding:8px'><div id='acertos'>0</div><div style='font-size:9px'>ACERTOS</div></div><div style='background:#111;border:1px solid var(--border);border-radius:12px;padding:8px'><div id='feitas'>0</div><div style='font-size:9px'>FEITAS</div></div><div style='background:#111;border:1px solid var(--border);border-radius:12px;padding:8px'><div id='faltam'>12</div><div style='font-size:9px'>FALTAM</div></div></div></div><div class='card'><div>MAPA DA PROVA</div><div class='map' id='map'></div></div><div class='card' style='border-color:#d4ff0022;background:#101108'><div>METODO 60/40</div><div style='font-size:11px;margin-top:6px'>Teoria: Concordancia haver impessoal. Logistica dutoviario.<br><br>Foco: Concordancia + Sistemas + Modais<br><br>Revisao D+1 D+3 D+7 D+15</div></div></div><div class='right' id='right'></div></div><script>const QUESTIONS=[{"materia": "PORT", "apostila": "Apostila 01 p.35-38", "ref": "Edital p.46 Concordancia", "teoria": "<b>Teoria 40%:</b> Haver existir = impessoal, nao plural. Faz 2 anos = certo.", "textoBase": "Havia muitas falhas no inventario, mas fazia meses que nao se faziam auditorias.", "enunciado": "Assinale a correcao correta quanto a concordancia:", "alts": ["Haviam muitas falhas e faziam meses", "Havia muitas falhas e fazia meses que nao se faziam auditorias", "Havia muitas falhas e faziam meses", "Havia muitas falhas e fazia meses que nao se fazia auditoria"], "correta": 3, "explicacao": "Havia impessoal singular. Fazer tempo tambem impessoal.", "dica": "Haviam 90% e pegadinha."}, {"materia": "MAT", "apostila": "Apostila 02 p.31", "ref": "Edital p.48 Equacoes Lineares", "teoria": "<b>Equacoes Lineares</b>: fator 1,15*0,90. Nao some %.", "textoBase": "Duto 800km, volume 1200m3/dia, aumento 15% e perda 10%", "enunciado": "Dia 5 - Equacoes Lineares: R$800 +15% -10% = ?", "alts": ["R$ 792 ou 828 conforme base", "R$800", "R$880", "R$828"], "correta": 0, "explicacao": "Multiplique fatores. Equacoes Lineares.", "dica": "Transforme % em fator para Equacoes Lineares."}, {"materia": "ESP", "apostila": "Apostila 03 p.52", "ref": "Edital p.52 Logistica Modais", "teoria": "<b>Logistica Modais</b>: IN 205 p.68 tombamento, p.69 inventario.", "textoBase": "Transpetro Logistica Modais: gestao patrimonial exige tombamento...", "enunciado": "Dia 5 - Sobre Logistica Modais, assinale correta:", "alts": ["Correta IN 205 sobre Logistica Modais", "Confunde tombamento/inventario", "Troca direto/indireto", "Lei antiga"], "correta": 0, "explicacao": "Logistica Modais: IN 205 p.68-69", "dica": "Decore IN 205 p.68-69 para Logistica Modais."}, {"materia": "PORT", "apostila": "Apostila 01 p.23", "ref": "Edital p.46 Concordancia", "teoria": "<b>Concordancia</b>: regra principal + excecao Cesgranrio.", "textoBase": "Texto Transpetro Dia 5: operacao dutoviaria embora eficiente demanda manutencao...", "enunciado": "Dia 5 - Sobre Concordancia, assinale a correta:", "alts": ["A correta sobre Concordancia", "B distrator excecao", "C invertida", "D anacronica"], "correta": 3, "explicacao": "Concordancia cai 80% das provas. Edital p.46.", "dica": "Cesgranrio troca 1 letra em Concordancia."}, {"materia": "MAT", "apostila": "Apostila 02 p.34", "ref": "Edital p.48 Equacoes Lineares", "teoria": "<b>Equacoes Lineares</b>: fator 1,15*0,90. Nao some %.", "textoBase": "Duto 800km, volume 1200m3/dia, aumento 15% e perda 10%", "enunciado": "Dia 5 - Equacoes Lineares: R$800 +15% -10% = ?", "alts": ["R$ 792 ou 828 conforme base", "R$800", "R$880", "R$828"], "correta": 0, "explicacao": "Multiplique fatores. Equacoes Lineares.", "dica": "Transforme % em fator para Equacoes Lineares."}, {"materia": "ESP", "apostila": "Apostila 03 p.55", "ref": "Edital p.52 Logistica Modais", "teoria": "<b>Logistica Modais</b>: IN 205 p.68 tombamento, p.69 inventario.", "textoBase": "Transpetro Logistica Modais: gestao patrimonial exige tombamento...", "enunciado": "Dia 5 - Sobre Logistica Modais, assinale correta:", "alts": ["Correta IN 205 sobre Logistica Modais", "Confunde tombamento/inventario", "Troca direto/indireto", "Lei antiga"], "correta": 0, "explicacao": "Logistica Modais: IN 205 p.68-69", "dica": "Decore IN 205 p.68-69 para Logistica Modais."}, {"materia": "PORT", "apostila": "Apostila 01 p.26", "ref": "Edital p.46 Concordancia", "teoria": "<b>Concordancia</b>: regra principal + excecao Cesgranrio.", "textoBase": "Texto Transpetro Dia 5: operacao dutoviaria embora eficiente demanda manutencao...", "enunciado": "Dia 5 - Sobre Concordancia, assinale a correta:", "alts": ["A correta sobre Concordancia", "B distrator excecao", "C invertida", "D anacronica"], "correta": 2, "explicacao": "Concordancia cai 80% das provas. Edital p.46.", "dica": "Cesgranrio troca 1 letra em Concordancia."}, {"materia": "MAT", "apostila": "Apostila 02 p.37", "ref": "Edital p.48 Equacoes Lineares", "teoria": "<b>Equacoes Lineares</b>: fator 1,15*0,90. Nao some %.", "textoBase": "Duto 800km, volume 1200m3/dia, aumento 15% e perda 10%", "enunciado": "Dia 5 - Equacoes Lineares: R$800 +15% -10% = ?", "alts": ["R$ 792 ou 828 conforme base", "R$800", "R$880", "R$828"], "correta": 0, "explicacao": "Multiplique fatores. Equacoes Lineares.", "dica": "Transforme % em fator para Equacoes Lineares."}, {"materia": "ESP", "apostila": "Apostila 03 p.58", "ref": "Edital p.52 Logistica Modais", "teoria": "<b>Logistica Modais</b>: IN 205 p.68 tombamento, p.69 inventario.", "textoBase": "Transpetro Logistica Modais: gestao patrimonial exige tombamento...", "enunciado": "Dia 5 - Sobre Logistica Modais, assinale correta:", "alts": ["Correta IN 205 sobre Logistica Modais", "Confunde tombamento/inventario", "Troca direto/indireto", "Lei antiga"], "correta": 0, "explicacao": "Logistica Modais: IN 205 p.68-69", "dica": "Decore IN 205 p.68-69 para Logistica Modais."}, {"materia": "PORT", "apostila": "Apostila 01 p.29", "ref": "Edital p.46 Concordancia", "teoria": "<b>Concordancia</b>: regra principal + excecao Cesgranrio.", "textoBase": "Texto Transpetro Dia 5: operacao dutoviaria embora eficiente demanda manutencao...", "enunciado": "Dia 5 - Sobre Concordancia, assinale a correta:", "alts": ["A correta sobre Concordancia", "B distrator excecao", "C invertida", "D anacronica"], "correta": 1, "explicacao": "Concordancia cai 80% das provas. Edital p.46.", "dica": "Cesgranrio troca 1 letra em Concordancia."}, {"materia": "MAT", "apostila": "Apostila 02 p.40", "ref": "Edital p.48 Equacoes Lineares", "teoria": "<b>Equacoes Lineares</b>: fator 1,15*0,90. Nao some %.", "textoBase": "Duto 800km, volume 1200m3/dia, aumento 15% e perda 10%", "enunciado": "Dia 5 - Equacoes Lineares: R$800 +15% -10% = ?", "alts": ["R$ 792 ou 828 conforme base", "R$800", "R$880", "R$828"], "correta": 0, "explicacao": "Multiplique fatores. Equacoes Lineares.", "dica": "Transforme % em fator para Equacoes Lineares."}, {"materia": "ESP", "apostila": "Apostila 03 p.61", "ref": "Edital p.52 Logistica Modais", "teoria": "<b>Logistica Modais</b>: IN 205 p.68 tombamento, p.69 inventario.", "textoBase": "Transpetro Logistica Modais: gestao patrimonial exige tombamento...", "enunciado": "Dia 5 - Sobre Logistica Modais, assinale correta:", "alts": ["Correta IN 205 sobre Logistica Modais", "Confunde tombamento/inventario", "Troca direto/indireto", "Lei antiga"], "correta": 0, "explicacao": "Logistica Modais: IN 205 p.68-69", "dica": "Decore IN 205 p.68-69 para Logistica Modais."}];
let current=0, answers=Array(12).fill(null), times=Array(12).fill(null), remaining=7200, paused=false, qStart=Date.now();
function init(){buildMap();renderQ();startTimer();}
function buildMap(){const m=document.getElementById('map');m.innerHTML='';QUESTIONS.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{current=i;qStart=Date.now();renderQ();};b.id='m'+i;m.appendChild(b);});updateMap();}
function updateMap(){QUESTIONS.forEach((q,i)=>{const b=document.getElementById('m'+i);if(!b)return;b.className='';if(i===current)b.classList.add('active');else if(answers[i]!==null)b.classList.add('done');});}
function startTimer(){setInterval(()=>{if(paused)return;remaining--;if(remaining<=0){showReport();return;}const h=Math.floor(remaining/3600),mm=Math.floor((remaining%3600)/60),s=remaining%60;const txt=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('timer').textContent=txt;document.getElementById('cron').textContent=txt;},1000);}
function togglePause(){paused=!paused;document.getElementById('pauseBtn').textContent=paused?'Retomar':'Pausar';if(!paused)qStart=Date.now();}
function resetQuiz(){if(!confirm('Reiniciar?'))return;answers=Array(12).fill(null);times=Array(12).fill(null);current=0;remaining=7200;renderQ();buildMap();}
function renderQ(){const q=QUESTIONS[current];const isAnswered=answers[current]!==null;const elapsed=Math.floor((Date.now()-qStart)/1000);const right=document.getElementById('right');let altsHtml='';q.alts.forEach((a,i)=>{let cls='';if(isAnswered){if(q.correta===i)cls='correct';else if(answers[current]===i)cls='wrong';}altsHtml+=`<button class="${cls}" onclick="answer(${i})"><span>${String.fromCharCode(65+i)}</span><span>${a}</span></button>`;});right.innerHTML=`<div class="theory"><b>TEORIA 40% - ${q.materia} • ${q.ref}</b><br><div style="font-size:12px;margin-top:6px">${q.teoria}</div></div><div style="margin-top:12px"><span class="tag neon">${q.materia}</span><span class="tag">${q.apostila}</span><span style="float:right">Q ${current+1}/12 ${elapsed}s</span></div><div class="qbox"><div style="padding:16px;border-bottom:1px solid var(--border)">${q.textoBase}</div><div style="padding:16px"><div style="font-size:18px;font-weight:800">${q.enunciado}</div><div class="alts" style="margin-top:14px">${altsHtml}</div></div>${isAnswered?`<div class="exp"><div>${answers[current]===q.correta?'✅ CORRETO':'❌ PEGADINHA'} GAB ${String.fromCharCode(65+q.correta)}</div><div style="margin-top:8px"><b>Explicacao:</b> ${q.explicacao}</div><div style="margin-top:10px;background:#171717;border:1px dashed var(--border);padding:10px"><div>DICA CESGRANRIO</div><div>${q.dica}</div></div><button class="btn" style="width:auto;background:var(--neon);color:#000" onclick="next()">PROXIMA →</button></div>`:''}</div><div style="margin-top:12px;display:flex;justify-content:space-between"><button class="btn" style="width:auto" onclick="prev()">← Anterior</button><button class="btn" style="width:auto;background:#fff;color:#000" onclick="next()">${current===11?'Ver relatorio':'Proxima →'}</button></div>`;updateMap();updateCounts();}
function answer(i){if(answers[current]!==null)return;answers[current]=i;times[current]=Math.floor((Date.now()-qStart)/1000);qStart=Date.now();renderQ();}
function next(){if(current<11){current++;qStart=Date.now();renderQ();}else showReport();}
function prev(){if(current>0){current--;qStart=Date.now();renderQ();}}
function updateCounts(){const feitas=answers.filter(a=>a!==null).length;const acertos=answers.filter((a,i)=>a===QUESTIONS[i].correta).length;document.getElementById('acertos').textContent=acertos;document.getElementById('feitas').textContent=feitas;document.getElementById('faltam').textContent=12-feitas;}
function showReport(){const acertos=answers.filter((a,i)=>a===QUESTIONS[i].correta).length;const totalTime=7200-remaining;const avg=times.filter(t=>t!==null).length?Math.round(times.filter(t=>t!==null).reduce((a,b)=>a+b,0)/times.filter(t=>t!==null).length):0;const right=document.getElementById('right');right.innerHTML=`<div><h2>RELATORIO DIA 5 - ${acertos}/12 - ${Math.round(acertos/12*100)}%</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div class="card">ACERTOS<br><b style="font-size:32px">${acertos}/12</b></div><div class="card">TEMPO MEDIO<br><b style="font-size:28px">${avg}s</b></div><div class="card">TOTAL<br><b>${totalTime}s</b></div></div><button class="btn" onclick="location.reload()">REFAZER</button><button class="btn" style="background:var(--neon);color:#000" onclick="window.close()">FEITO</button><div style="margin-top:12px;background:#101108;border:1px solid var(--neon);padding:12px;font-size:11px"><b>REVISAO ESPACADA:</b> Revisar em D+1, D+3, D+7, D+15</div></div>`;}
init();
</script></body></html>
