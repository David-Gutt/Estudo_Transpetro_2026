ed(e,t,n){var r,l={},o=null,i=null;n!==void 0&&(o=""+n),t.key!==void 0&&(o=""+t.key),t.ref!==void 0&&(i=t.ref);for(r in t)Mm.call(t,r)&&!Dm.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:Om,type:e,key:o,ref:i,props:l,_owner:Am.current}}var x=ed,w=ed;var Oe=[{id:1,area:"PORTUGUÊS",topic:"Ortografia Oficial - Novo Acordo",enunciado:"Assinale a alternativa grafada CORRETAMENTE segundo o Novo Acordo Ortográfico:",alternatives:[{letter:"A",text:"auto-escola"},{letter:"B",text:"anti-inflamatório"},{letter:"C",text:"anti-social"},{letter:"D",text:"micro-ônibus"},{letter:"E",text:"auto escola"}],correct:"B",explicacao:"Anti + palavra iniciada por i = hífen obrigatório quando há mesma vogal. Anti-inflamatório mantém o hífen porque i + i. Já anti-social vira ANTISSOCIAL (sem hífen, dobra o s), micro-ônibus vira MICRO-ÔNIBUS? Na verdade após Acordo: microônibus (sem hífen, sem acento no micro), auto-escola vira autoescola (sem hífen, prefixo auto + consoante).",formula:"Regra: prefixo terminado em vogal + palavra iniciada pela MESMA vogal → hífen. Ex: anti-inflamatório, micro-ondas. Se vogais diferentes → sem hífen.",dica:"Cesgranrio ama cobrar anti- + i/h. Lembre: anti-inflamatório e anti-higiênico SEMPRE com hífen por causa do h e do i igual. Anti-social NUNCA tem hífen.",ref:"Apostila Vol. 1 - Português | Módulo Ortografia Oficial | Pág. 12-15 e Tabela de Prefixos p.18"},{id:2,area:"PORTUGUÊS",topic:"Emprego dos Porquês",enunciado:'Complete: "Não entendi ___ você faltou, me diga o ___."',alternatives:[{letter:"A",text:"por que / porquê"},{letter:"B",text:"por que / porque"},{letter:"C",text:"porque / porquê"},{letter:"D",text:"por quê / por que"},{letter:"E",text:"por que / porque"}],correct:"A",explicacao:'Primeira lacuna: "por que você faltou" = por qual motivo (separado, sem acento) introduz oração interrogativa indireta. Segunda: "o porquê" = substantivo (= o motivo), sempre vem com artigo ou determinante → porquê com acento e junto.',formula:"por que = por qual motivo (pergunta) | porque = pois (resposta) | por quê = fim de frase | porquê = substantivo (o motivo)",dica:'Cesgranrio truque: se tem "o", "um", "meu", "esse" antes → é PORQUÊ junto com acento. Se pode trocar por "por qual motivo" → POR QUE separado sem acento.',ref:"Apostila Vol. 1 - Português | Módulo Porquês | Pág. 22-24 | Quadro-resumo p.25"},{id:3,area:"PORTUGUÊS",topic:"Onde / Aonde",enunciado:'"A cidade ___ moro fica longe. É para ___ vou nas férias."',alternatives:[{letter:"A",text:"onde / onde"},{letter:"B",text:"aonde / aonde"},{letter:"C",text:"onde / aonde"},{letter:"D",text:"em que / onde"},{letter:"E",text:"aonde / onde"}],correct:"C",explicacao:'ONDE = lugar fixo, sem ideia de movimento (em que). "A cidade onde/em que moro". AONDE = para onde, ideia de deslocamento com verbo ir, chegar, voltar. "Para aonde vou nas férias" = para onde.',formula:"ONDE = em que (lugar) | AONDE = para onde (movimento). Teste: troque por PARA ONDE, se fizer sentido use AONDE.",dica:"Cesgranrio só usa AONDE com verbos de movimento: ir, voltar, chegar, levar. 90% das questões a resposta é ONDE. Desconfie de AONDE com verbo morar, estar, ficar.",ref:"Apostila Vol. 1 - Português | Módulo Emprego de Onde | Pág. 31"},{id:4,area:"PORTUGUÊS",topic:"Mal x Mau",enunciado:'Assinale a correta: "Ele é um ___ aluno, sempre de ___ humor quando chega atrasado."',alternatives:[{letter:"A",text:"mal / mal"},{letter:"B",text:"mau / mal"},{letter:"C",text:"mal / mau"},{letter:"D",text:"mau / mau"},{letter:"E",text:"mau / mal"}],correct:"D",explicacao:'MAU = adjetivo, contrário de BOM. Mau aluno (bom aluno), mau humor (bom humor). MAL = advérbio (contrário de bem) ou substantivo. "Ele está mal-humorado" com hífen, mas "de mau humor" é locução com mau.',formula:"MAU ↔ BOM (adjetivo) | MAL ↔ BEM (advérbio/substantivo). Dica prática: troque por BOM/BEM para testar.",dica:'Cesgranrio: "mau humor" quase sempre é MAU. Eles confundem com "mal-humorado" que é com L e hífen. Se for adjetivo qualificando pessoa/coisa, é MAU.',ref:"Apostila Vol. 1 - Português | Módulo Homônimos e Parônimos | Pág. 38-40"},{id:5,area:"PORTUGUÊS",topic:"Hífen - Casos Especiais",enunciado:"Assinale a alternativa em que o uso do hífen está CORRETO pelo Novo Acordo:",alternatives:[{letter:"A",text:"super-homem"},{letter:"B",text:"recem-nascido"},{letter:"C",text:"antihigiênico"},{letter:"D",text:"microondas"},{letter:"E",text:"auto-retrato"}],correct:"A",explicacao:"Super-homem: prefixo super + palavra iniciada por h → hífen obrigatório. Além disso, prefixos terminados em R (super, inter, hiper) mantêm hífen quando a segunda palavra começa com R: super-homem, hiper-realismo, inter-regional. Recém-nascido exige acento e hífen. Anti-higiênico exige hífen por começar com h. Micro-ondas exige hífen. Autorretrato é junto sem hífen.",formula:"Hífen obrigatório: prefixo + H (anti-higiênico, super-homem) | mesma vogal (micro-ondas, anti-inflamatório) | prefixos super, hiper, inter + R (super-homem, super-resistente)",dica:"Cesgranrio: se o prefixo termina em R e a palavra seguinte começa com R ou H, pode cravar hífen. SUPER-HOMEM e SUPER-HERÓI são clássicas da banca.",ref:"Apostila Vol. 1 - Português | Tabela de Hífen | Pág. 16-20 | Exercícios p.21"},{id:6,area:"MATEMÁTICA",topic:"Regra de 3 Simples - Direta",enunciado:"3 caminhões, fazendo 5 viagens cada, transportam 13.500 kg de carga. Quantos kg transportarão 7 caminhões, fazendo também 5 viagens cada?",alternatives:[{letter:"A",text:"31.500 kg"},{letter:"B",text:"22.500 kg"},{letter:"C",text:"52.500 kg"},{letter:"D",text:"18.900 kg"},{letter:"E",text:"40.500 kg"}],correct:"A",explicacao:"Grandezas diretamente proporcionais: mais caminhões = mais carga. Viagens constantes (5), pode ignorar. 3 caminhões → 13.500 kg, então 1 caminhão → 4.500 kg. 7 caminhões → 7 x 4.500 = 31.500 kg.",formula:`3 —— 13.500
7 —— x

x = (7 × 13.500) / 3 = 94.500 / 3 = 31.500 kg

Ou regra: 13.500 ÷ 3 = 4.500 por caminhão`,dica:"Cesgranrio costuma colocar dado inútil (5 viagens) para confundir. Se a grandeza não muda (mesmo nº de viagens), risque e ignore. Foque no que varia.",ref:"Apostila Vol. 2 - Matemática | Módulo Regra de 3 Simples | Pág. 45-47"},{id:7,area:"MATEMÁTICA",topic:"Regra de 3 Composta",enunciado:"5 máquinas, trabalhando 6 dias, 8h por dia, produzem 3.000 peças. Quantas peças produzirão 8 máquinas, trabalhando 4 dias, 9h por dia?",alternatives:[{letter:"A",text:"4.800 peças"},{letter:"B",text:"3.200 peças"},{letter:"C",text:"3.600 peças"},{letter:"D",text:"4.000 peças"},{letter:"E",text:"2.700 peças"}],correct:"C",explicacao:"Todas diretamente proporcionais às peças: mais máquinas = mais peças, mais dias = mais peças, mais horas = mais peças.",formula:`5 máq × 6 dias × 8h → 3.000
8 máq × 4 dias × 9h → x

x = 3000 × (8/5) × (4/6) × (9/8)
x = 3000 × 1,6 × 0,666... × 1,125
x = 3000 × 1,2 = 3.600 peças`,dica:"Na composta, compare cada grandeza com a incógnita (peças). Se aumentar a grandeza e aumentar peças → direta (multiplica em cima). Cesgranrio sempre mistura 3 grandezas, monte frações.",ref:"Apostila Vol. 2 - Matemática | Módulo Regra de 3 Composta | Pág. 48-52"},{id:8,area:"MATEMÁTICA",topic:"Porcentagem Sucessiva",enunciado:"Um equipamento custa R$ 12.000,00. Sofre um desconto de 20% e, sobre o valor já com desconto, recebe um aumento de 10%. Qual o valor final?",alternatives:[{letter:"A",text:"R$ 10.560,00"},{letter:"B",text:"R$ 10.800,00"},{letter:"C",text:"R$ 11.520,00"},{letter:"D",text:"R$ 12.000,00"},{letter:"E",text:"R$ 10.080,00"}],correct:"A",explicacao:"Primeiro desconto: 12.000 × 0,8 = 9.600. Depois aumento sobre 9.600: 9.600 × 1,1 = 10.560. Note que desconto e aumento não se anulam.",formula:`Valor final = 12.000 × (1 - 0,20) × (1 + 0,10)

= 12.000 × 0,88

= 1,1 × 1,2 -1 = 0,32 = 32%`,dica:'Cesgranrio AMA essa. Sempre que vir "sucessivos", multiplique os fatores. 10%+20% = 32%, não 30%. Grave: 1,1×1,2=1,32.',ref:"Apostila Vol. 2 - Matemática | Módulo Porcentagem Sucessiva | Pág. 60"},{id:10,area:"MATEMÁTICA",topic:"Regra de 3 Inversa",enunciado:"8 pedreiros constroem um muro em 12 dias. Em quantos dias 6 pedreiros construirão o mesmo muro?",alternatives:[{letter:"A",text:"16 dias"},{letter:"B",text:"14 dias"},{letter:"C",text:"9 dias"},{letter:"D",text:"18 dias"},{letter:"E",text:"15 dias"}],correct:"A",explicacao:"Menos pedreiros = mais dias. Grandezas inversamente proporcionais.",formula:`8 pedreiros — 12 dias
